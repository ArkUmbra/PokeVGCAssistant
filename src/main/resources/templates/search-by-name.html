<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>Search By Name</title>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container-sm">

        <div th:if="${result.records.isEmpty()}" style="padding:10px; margin-bottom: 10px; background-color:rgb(30, 30, 40)">
            No results!
        </div>

        <div th:each="record: ${result.records}" style="padding:10px; margin-bottom: 10px; background-color:rgb(30, 30, 40)">
            <th:block th:switch="${record.searchRecordType.category}">
                <div th:case="0">
                    <div th:replace="fragments/nameSearchMoveRecord" />
                </div>
                <div th:case="1">

                    <div th:replace="fragments/nameSearchPokemonRecord" />
                </div>
                <div th:case="2">
                    <div th:replace="fragments/nameSearchAbilityRecord" />
                </div>
            </th:block>
        </div>

    </div>
</table>

</div>
</html>
