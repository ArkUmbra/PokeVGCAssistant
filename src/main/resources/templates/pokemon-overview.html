<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>All Pokemon</title>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body>
<p th:text="|Showing ${numOfPokemon} Pokemon|" />

<table>
    <tr>
        <td>Name</td>
        <td>Pokedex #</td>
        <td>Type</td>
        <td>Base Stat Total</td>
        <td>HP</td>
        <td>Atk</td>
        <td>Def</td>
        <td>SpAtk</td>
        <td>SpDef</td>
        <td>Speed</td>
    </tr>
    <tr th:each="summary: ${pokemonSummaries}">
        <td>
            <span th:if="${#strings.isEmpty(summary.formName)}">
                <a th:href="@{/pokemon/{pokemonId}(pokemonId=${summary.idName})}">
                    <span th:text="${summary.name.english}" />
                </a>
            </span>
            <span th:unless="${#strings.isEmpty(summary.formName)}">
                <a th:href="@{/pokemon/{pokemonId}(pokemonId=${summary.idName}, formName=${summary.formName})}">
                    <span th:text="${summary.name.english + ' (' + summary.formName + ')'}" />
                </a>
            </span>
        </td>

        <td th:text="${summary.pokedexNumber.national }" />

        <td>
            <span th:each="type: ${summary.types}">
                <div th:replace="fragments/typeIcon :: ${type}" />
            </span>
        </td>
        <td th:text="${summary.baseStats.total}" />
        <td th:text="${summary.baseStats.hp}" />
        <td th:text="${summary.baseStats.atk}" />
        <td th:text="${summary.baseStats.def}" />
        <td th:text="${summary.baseStats.specialAtk}" />
        <td th:text="${summary.baseStats.specialDef}" />
        <td th:text="${summary.baseStats.speed}" />
    </tr>
</table>

</body>
</html>
