<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>Regulation</title>

    <div th:replace="~{fragments/header}" />
</head>
<body>

<div class="container">
    <p th:text="|Manage information on Pokemon Champions regulations| " />


    <a class="btn btn-primary" href="/regulation/create" role="button">Create new regulation</a>

    <hr />

    <h3>Existing Regulations</h3>

    <th:block th:each="regSummary : ${regSummaries}">

        <div class="card mb-3" style="width: 90%;">
            <div class="row card-body align-items-center">
                <div class="col-md-auto" th:style="|width: 128px; height: 128px; background-image: url('${regSummary.representativeSpriteUrl}'); background-size: ${regSummary.representativeSpriteBgSize}; background-position: ${regSummary.representativeSpritePosition}; flex-shrink: 0;|">
                </div>
                <div class="col-md-8">
                    <h5 class="card-title" th:text="${regSummary.name + ' (' + regSummary.id + ')'}"></h5>
                    <p class="card-text">[[${regSummary.startDate}]] ~ [[${regSummary.endDate}]]</p>
                    <div class="d-flex gap-2">
                        <a th:href="@{/regulation/{id}(id=${regSummary.id})}" class="btn btn-primary">View regulation</a>
                        <form th:action="@{/regulation/{id}/delete(id=${regSummary.id})}"
                              method="post"
                              style="display: inline;"
                              th:data-reg-name="${regSummary.name}"
                              onsubmit="return confirm('Are you sure you want to delete ' + (this.getAttribute('data-reg-name') || 'this regulation') + '?');">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <div th:replace="~{fragments/headerNav}" />
</div>

</body>
</html>
