<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>Regulation</title>

    <div th:replace="~{fragments/header}" />
</head>
<body>

<div class="container">
    <p th:text="|Manage information on Pokemon Champions regulations| " />


    <a class="btn btn-primary" href="/regulation/create" role="button">Create new regulation</a>

    <hr />

    <h3>Existing Regulations</h3>

    <th:block th:each="regSummary : ${regSummaries}">

        <div class="card" style="width: 90%;">
            <div class="row card-body">
                <div class="col-md-4" th:style="|width: 128px; height: 128px; background-image: url('${regSummary.representativeSpriteUrl}'); background-size: ${regSummary.representativeSpriteBgSize}; background-position: ${regSummary.representativeSpritePosition}; flex-shrink: 0;|">
                </div>
                <div class="col-md-8">
                    <h5 class="card-title" th:text="${regSummary.name}"></h5>
                    <p class="card-text">[[${regSummary.startDate}]] ~ [[${regSummary.endDate}]] @ [[${regSummary.representativePokemonId}]]</p>
                    <a href="#" class="btn btn-primary stretched-link">View regulation</a>
                </div>
            </div>
        </div>
    </th:block>

    <div th:replace="~{fragments/bottomNavigation :: regulation}" />
</div>

</body>
</html>
