<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title>All Abilities</title>

    <div th:replace="~{fragments/header}" />
</head>
<body class="container">
<p th:text="|Showing ${numOfAbilities} abilities|" />

<table class="table table-sm table-striped table-hover">
    <thead>
        <tr>
            <th>Ability</th>
            <th>Description</th>
            <th># with this Ability</th>
            <th>Meta Data</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="summary: ${abilitySummaries}">
            <td>
                <a th:href="@{/ability/{id}(id=${summary.ability.idName})}">
                    <p th:text="${summary.ability.name.english}" />
                </a>
            </td>

            <td th:text="${summary.ability.ingameDescription}" />
            <td th:text="${summary.matchingPokemon}" />
            <td th:text="${summary.ability.metaData}" />
        </tr>
    </tbody>
</table>

<div th:replace="~{fragments/bottomNavigation :: ability}" />

</body>
</html>
