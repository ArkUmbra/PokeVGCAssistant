<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Getting Started: Serving Web Content</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<p th:text="|Hello, there are ${numOfAbilities} abilities|" />

<table>
    <tr>
        <td>Ability</td>
        <td>Description</td>
        <td>Meta Data</td>
    </tr>
    <tr th:each="ability: ${abilities}">
        <td>
            <a th:href="@{/ability/{id}(id=${ability.idName})}">
                <p th:text="${ability.name.english}" />
            </a>
        </td>

        <td th:text="${ability.ingameDescription}" />
        <td th:text="${ability.metaData}" />
    </tr>
</table>

</body>
</html>
