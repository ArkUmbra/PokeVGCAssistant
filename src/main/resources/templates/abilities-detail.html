<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Getting Started: Serving Web Content</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>

<a href="/abilities">Back</a>

<h3 th:text="${abilityDetail.ability.name.english + ' (' + abilityDetail.ability.name.japanese} + ')'" />
<p th:text="${abilityDetail.ability.ingameDescription}" />

<h3>With Regular Ability</h3>

<table>
    <tr>
        <td>Pokemon</td>
        <td>Types</td>
        <td>Base Stat Total</td>
        <td>HP</td>
        <td>Atk</td>
        <td>Def</td>
        <td>SpAtk</td>
        <td>SpDef</td>
        <td>Speed</td>
    </tr>
    <tr th:each="pokemonSummary: ${abilityDetail.pokemonWithAbility}">
        <td th:text="${pokemonSummary.name.english}" />
        <td th:text="${pokemonSummary.types}" />
        <td th:text="${pokemonSummary.baseStats.total}" />
        <td th:text="${pokemonSummary.baseStats.hp}" />
        <td th:text="${pokemonSummary.baseStats.atk}" />
        <td th:text="${pokemonSummary.baseStats.def}" />
        <td th:text="${pokemonSummary.baseStats.specialAtk}" />
        <td th:text="${pokemonSummary.baseStats.specialDef}" />
        <td th:text="${pokemonSummary.baseStats.speed}" />
    </tr>
</table>

<h3>With Hidden Ability</h3>

<table>
    <tr>
        <td>Pokemon</td>
        <td>Types</td>
        <td>Base Stat Total</td>
        <td>HP</td>
        <td>Atk</td>
        <td>Def</td>
        <td>SpAtk</td>
        <td>SpDef</td>
        <td>Speed</td>
    </tr>
    <tr th:each="pokemonSummary: ${abilityDetail.pokemonWithHiddenAbility}">
        <td th:text="${pokemonSummary.name.english}" />
        <td th:text="${pokemonSummary.types}" />
        <td th:text="${pokemonSummary.baseStats.total}" />
        <td th:text="${pokemonSummary.baseStats.hp}" />
        <td th:text="${pokemonSummary.baseStats.atk}" />
        <td th:text="${pokemonSummary.baseStats.def}" />
        <td th:text="${pokemonSummary.baseStats.specialAtk}" />
        <td th:text="${pokemonSummary.baseStats.specialDef}" />
        <td th:text="${pokemonSummary.baseStats.speed}" />
    </tr>
</table>

</body>
</html>
