<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title th:text="${abilityDetail.ability.name.english}">Details</title>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body class="container">

<a href="/ability">View all abilities</a>

<h3 th:text="${abilityDetail.ability.name.english + ' (' + abilityDetail.ability.name.japanese} + ')'" />
<p th:text="${abilityDetail.ability.ingameDescription}" />



<div th:if="${!abilityDetail.pokemonWithAbility.isEmpty}" th:with="pokemonSummaries=${abilityDetail.pokemonWithAbility}">
    <h3>With Regular Ability</h3>

    <div th:replace="fragments/pokemonSummaryList" />
</div>



<div th:if="${!abilityDetail.pokemonWithHiddenAbility.isEmpty}" th:with="pokemonSummaries=${abilityDetail.pokemonWithHiddenAbility}">
    <h3>With Hidden Ability</h3>

    <div th:replace="fragments/pokemonSummaryList" />
</div>


</body>
</html>
