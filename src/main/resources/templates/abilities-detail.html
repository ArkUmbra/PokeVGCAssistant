<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
    <body class="container">

        <h3 th:text="${abilityDetail.ability.name.english + ' (' + abilityDetail.ability.name.japanese} + ')'" />
        <p th:text="${abilityDetail.ability.ingameDescription}" />

        <div th:if="${!abilityDetail.pokemonWithAbility.isEmpty}" th:with="pokemonSummaries=${abilityDetail.pokemonWithAbility}">
            <h3>With Regular Ability</h3>

            <div th:replace="fragments/pokemonSummaryList" />
        </div>

        <div th:if="${!abilityDetail.pokemonWithHiddenAbility.isEmpty}" th:with="pokemonSummaries=${abilityDetail.pokemonWithHiddenAbility}">
            <h3>With Hidden Ability</h3>

            <div th:replace="fragments/pokemonSummaryList" />
        </div>

        <div th:replace="~{fragments/bottomNavigation :: ability}" />

    </body>

    <head>
        <title th:text="${abilityDetail.ability.name.english}">Details</title>

        <div th:replace="~{fragments/header}" />
    </head>
</html>
