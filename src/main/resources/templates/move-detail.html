<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <title th:text="${moveDetail.move.name.english}">Details</title>

    <div th:replace="~{fragments/header}" />
</head>
<body class="container">

<h3 th:text="${moveDetail.move.name.english + ' (' + moveDetail.move.name.japanese} + ')'" />
<p th:text="${moveDetail.move.ingameDescription}" />

<div style="width:470px">
    <span class="row">
        <div class="col">Type</div>
        <div class="col">
            <div class="" th:replace="~{fragments/typeIcon :: ${moveDetail.move.type}}" />
        </div>
    </span>
    <div class="row">
        <div class="col" th:text='Category' + "${moveDetail.move.category}" />

        <div class="col">
            <div th:replace="~{fragments/moveCategory :: ${moveDetail.move.category}}" />
        </div>
    </div>

    <div class="row">
        <div class="col" th:text='Power' />

        <div class="col" th:text="${moveDetail.move.power}" />
    </div>

    <div class="row">
        <div class="col" th:text='PP' />

        <div class="col" th:text="${moveDetail.move.pp}" />
    </div>

    <div class="row">
        <div class="col" th:text='Accuracy' />

        <div class="col" th:text="${moveDetail.move.accuracy}" />
    </div>

    <div class="row">
        <div class="col" th:text='Priority' />

        <div class="col" th:text="${moveDetail.move.priority}" />
    </div>

    <div class="row">
        <div class="col">Critical Hit %</div>

        <div class="col" th:text="${moveDetail.move.critRatio}" />
    </div>

    <div class="row">
        <div class="col">Effect Chance %</div>

        <div class="col" th:text="${moveDetail.move.effectChance.chance}" />
    </div>

    <div class="row">
        <div class="col" th:text='Target' />

        <div class="col" th:text="${moveDetail.move.moveTarget}" />
    </div>

    <div class="row">
        <div class="col" th:text='Misc' />

        <div class="col">
            <span th:each="metaData: ${moveDetail.move.attackMetaData}" style="float:left" th:text="${metaData}">
            </span>
        </div>

    </div>


</div>


<div th:with="pokemonSummaries=${moveDetail.pokemonWithMove}" style="margin-top: 25px">
    <h3>Pokemon With This Move</h3>

    <div th:replace="fragments/pokemonSummaryList" />
</div>


<div th:replace="~{fragments/bottomNavigation :: move}" />

</body>
</html>
